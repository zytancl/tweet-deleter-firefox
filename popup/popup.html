<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tweet Cleaner v1.3</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      width: 320px;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    .container {
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 18px;
      margin: 0;
      color: #1d9bf0;
    }
    .lang-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #536471;
      cursor: pointer;
      user-select: none;
      background: #f7f9fa;
      border: 1px solid #cfd9de;
      border-radius: 12px;
      padding: 3px 8px;
      white-space: nowrap;
    }
    .lang-toggle:hover {
      background: #e7e7e7;
    }
    .lang-toggle .lang-label {
      font-weight: bold;
      color: #1d9bf0;
    }
    .button {
      display: block;
      width: 100%;
      background-color: #1d9bf0;
      color: white;
      border: none;
      border-radius: 24px;
      padding: 10px 16px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 16px;
    }
    .button:hover {
      background-color: #1a8cd8;
    }
    .button:disabled {
      background-color: #8ecdf7;
      cursor: not-allowed;
    }
    .input-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 14px;
      margin-bottom: 4px;
    }
    input[type="text"], input[type="date"] {
      width: calc(100% - 16px);
      padding: 8px;
      border: 1px solid #cfd9de;
      border-radius: 4px;
      font-size: 14px;
    }
    .checkbox-group {
      display: flex;
      align-items: center;
      margin-bottom: 8px;
    }
    .checkbox-group label {
      margin-left: 8px;
      margin-bottom: 0;
      cursor: pointer;
    }
    .status {
      margin-top: 16px;
      padding: 8px;
      background-color: #f7f9fa;
      border-radius: 4px;
      font-size: 13px;
      display: none;
    }
    .error {
      color: #e0245e;
    }
    .help-text {
      font-size: 12px;
      color: #536471;
      margin-top: 2px;
      margin-bottom: 8px;
    }
    .tabs {
      display: flex;
      border-bottom: 1px solid #cfd9de;
      margin-bottom: 16px;
    }
    .tab {
      padding: 8px 16px;
      cursor: pointer;
      font-size: 14px;
      border-bottom: 2px solid transparent;
    }
    .tab.active {
      border-bottom-color: #1d9bf0;
      color: #1d9bf0;
      font-weight: bold;
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }
    .refresh-btn {
      font-size: 12px;
      color: #1d9bf0;
      cursor: pointer;
      margin-top: 4px;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1 data-i18n="title">Tweet Cleaner v1.3</h1>
      <div class="lang-toggle" id="langToggle">
        <span>🌐</span><span class="lang-label" id="langLabel">KO</span>
      </div>
    </div>

    <div class="tabs">
      <div class="tab active" data-tab="filters" data-i18n="tab_filters">Filters</div>
    </div>

    <div id="filters" class="tab-content active">
      <div class="input-group">
        <label for="keywords" data-i18n="label_keywords">Keyword filter (comma-separated)</label>
        <input type="text" id="keywords" data-i18n-placeholder="placeholder_keywords">
        <div class="help-text" data-i18n="help_keywords">Only tweets containing these keywords will be deleted</div>
      </div>

      <div class="input-group">
        <label for="ignore" data-i18n="label_ignore">Ignore tweet IDs (comma-separated)</label>
        <input type="text" id="ignore" data-i18n-placeholder="placeholder_ignore">
        <div class="help-text" data-i18n="help_ignore">Tweets with these IDs will not be deleted</div>
      </div>

      <div class="checkbox-group">
        <input type="checkbox" id="unretweet" checked>
        <label for="unretweet" data-i18n="label_unretweet">Undo retweets</label>
      </div>

      <div class="checkbox-group">
        <input type="checkbox" id="keepPin" checked>
        <label for="keepPin" data-i18n="label_keepPin">Keep pinned tweet</label>
      </div>

      <div class="checkbox-group">
        <input type="checkbox" id="linkOnly">
        <label for="linkOnly" data-i18n="label_linkOnly">Only tweets with links</label>
      </div>
    </div>

    <div id="advanced" class="tab-content">
      <div class="checkbox-group">
        <input type="checkbox" id="debugMode">
        <label for="debugMode" data-i18n="label_debug">Debug mode</label>
        <div class="help-text" data-i18n="help_debug">Print detailed logs to console</div>
      </div>

      <div class="input-group">
        <label data-i18n="label_authStatus">API Auth Status</label>
        <div id="authStatus" data-i18n="auth_checking">Checking...</div>
        <div class="refresh-btn" id="refreshAuth" data-i18n="btn_refreshAuth">Refresh auth info</div>
        <div class="help-text" data-i18n="help_auth">If there's an issue, refresh your X.com profile page and scroll</div>
      </div>
    </div>

    <button id="cleanBtn" class="button" data-i18n="btn_clean">Start deleting tweets!</button>

    <div id="status" class="status"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
